[project]
name = "docs-rag"
version = "0.1.0"
description = "RAG over the FastAPI docs with a measured retrieval eval"
authors = [
    { name = "Eren Han Yasar", email = "drknse@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "fastapi>=0.143.1",
    "fastembed>=0.9.0",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
docs-rag-search = "docs_rag.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
